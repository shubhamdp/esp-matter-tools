name: PyPI release

on:
  push:
    branches:
      - main

jobs:
  build_and_upload:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip build setuptools twine

    - name: Build and upload esp-matter-mfg-tool ${{ github.event.release.tag_name }}
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_PROJECT_TOKEN }}
      run: |
        cd mfg_tool
        PUBLISHED_VERSION=$(curl https://pypi.org/pypi/esp-matter-mfg-tool/json 2>/dev/null | jq -r '.info.version')
        CURRENT_VERSION=$(python setup.py --version 2>/dev/null)
        if [ "$PUBLISHED_VERSION" == "$CURRENT_VERSION" ]; then
          echo "Version ${PUBLISHED_VERSION} already published, skipping..."
          exit 0
        else
          echo "Packaging and publishing new esp-matter-mfg-tool version: ${CURRENT_VERSION}"
          python -m build
          twine check dist/* && twine upload dist/*
        fi

  windows_build_and_upload:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip build setuptools pyinstaller

    - name: Build esp-matter-mfg-tool on Windows
      shell: pwsh
      run: |
        cd mfg_tool
        $CURRENT_VERSION = python setup.py --version 2>$null
        Write-Host "Building esp-matter-mfg-tool version: $CURRENT_VERSION on Windows"
        python -m pip install -r requirements.txt
        python -m build
        if ($LASTEXITCODE -eq 0) {
          Write-Host "Windows build completed successfully"
        } else {
          Write-Host "Windows build failed"
          exit 1
        }

    - name: Create Windows executable
      shell: pwsh
      run: |
        cd mfg_tool
        Write-Host "Creating Windows executable with PyInstaller"
        # Add current directory to PYTHONPATH and run PyInstaller with proper module path
        $env:PYTHONPATH = "."
        pyinstaller --onefile --name esp-matter-mfg-tool -c --paths . --paths deps --paths sources --hidden-import deps.spake2p --hidden-import deps.mfg_gen --hidden-import deps.generate_setup_payload sources/mfg_tool.py
        if ($LASTEXITCODE -eq 0) {
          Write-Host "Windows executable created successfully"
        } else {
          Write-Host "Failed to create Windows executable"
          exit 1
        }
  
    - name: compress Windows executable
      shell: pwsh
      run: |
        cd mfg_tool/dist
        Compress-Archive -Path esp-matter-mfg-tool.exe -DestinationPath esp-matter-mfg-tool.zip

    - name: Upload Windows executable
      uses: actions/upload-artifact@v4.6.2
      with:
        name: esp-matter-mfg-tool-windows-exe
        path: mfg_tool/dist/esp-matter-mfg-tool.zip

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: mfg_tool/dist/esp-matter-mfg-tool.zip
        title: ${{ github.event.release.tag_name }}
